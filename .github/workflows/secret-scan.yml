# 커밋된 시크릿 차단 게이트 (TEAMDEV-1406)
name: Secret Scan
on:
  pull_request:
    branches: [develop, main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  scan:
    name: committed secrets
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: '[block] 판정 자체 테스트'
        run: python3 .github/scripts/guard_secret_scan.py --self-test
      - name: '[block] 추가된 줄에 시크릿이 있는가'
        run: python3 .github/scripts/guard_secret_scan.py
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
